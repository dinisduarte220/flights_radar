<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='style.css'>
    <link rel='shortcut icon' href='../../../assets/logo.ico' type='image/x-icon'>
    <script src='https://unpkg.com/boxicons@2.1.4/dist/boxicons.js'></script>
    <script src='https://kit.fontawesome.com/207c253573.js' crossorigin='anonymous'></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.21.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5.21.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <link rel="stylesheet" href="../../../shared/snackbar.css">
    <title>Flight Radar</title>
</head>
<body>
    <div id="map"></div>

    <!-- Bottom Actions -->
    <div id="bottomActions">
       <div class="action" onclick="window.location.href = `../../../`">
           <i class="fa-solid fa-house"></i>
           <div class="label">Menu Inicial</div>
       </div>
       <div class="action">
           <i class="fa-solid fa-magnifying-glass"></i>
           <div class="label">Procurar</div>
       </div>
       <div class="action">
           <i class="fa-solid fa-filter"></i>
           <div class="label">Filtros</div>
       </div>
       <div class="action">
           <i class="fa-solid fa-expand"></i>
           <div class="label">Remover / Mostrar UI</div>
       </div>
       <div class="action">
           <i class="fa-solid fa-gear" onclick="showSettings()"></i>
           <div class="label">Definições</div>
       </div>
    </div>

    <!-- Widgets -->
    <div id="settingsBar" style="display: none;">
        <h2 style="width: 100%; text-align: center; margin-bottom: 5px">Definições</h2>
        <h4>Radar</h4>
        <div class="settingsOption">
            <label for="radar_range">Raio (Milhas Náuticas)</label>
            <input type="range" min="10" max="100" step="5" value="55" name="radar_range" id="radar_range" oninput="drawRadius(value)">
        </div>
        <div class="hl"></div>
        <h4>Aviões</h4>
        <div class="settingsOption">
            <label for="planes_icon">Identificadores</label>
            <select name="planes_icon" id="planes_icon">
                <option value="icon">Icon</option>
                <option value="point">Radar</option>
            </select>
        </div>
        <!-- <div class="settingsOption">
            <label for="planes_icon">Linha de Posição</label>
            <input type="range" min="1" max="3" step="1" name="" id="">
        </div> -->

        <div class="hl"></div>
        <h4>Localização</h4>
        <div class="settingsOption checkbox">
            <input type="checkbox" id="checkbox_showLocation"> Mostrar Ponto de Localização
        </div>

        <div class="hl"></div>
        <h4>Informações (Máximo 3 Opções)</h4>
        <div class="settingsOption checkbox">
            <input type="checkbox" id="label_callsign" onchange="verifyCheckBoxes()"> Callsign
        </div>
        <div class="settingsOption checkbox">
            <input type="checkbox" id="label_route" onchange="verifyCheckBoxes()"> Rota
        </div>
        <div class="settingsOption checkbox">
            <input type="checkbox" id="label_altitude" onchange="verifyCheckBoxes()"> Altitude (Pés)
        </div>
        <div class="settingsOption checkbox">
            <input type="checkbox" id="label_selected_altitude" onchange="verifyCheckBoxes()"> Altitude Selecionada (Pés)
        </div>
        <div class="settingsOption checkbox">
            <input type="checkbox" id="label_speed" onchange="verifyCheckBoxes()"> Velocidade (Nós)
        </div>
        <div class="settingsOption checkbox">
            <input type="checkbox" id="label_squawk" onchange="verifyCheckBoxes()"> Squawk
        </div>
        <div class="settingsOption checkbox">
            <input type="checkbox" id="label_model" onchange="verifyCheckBoxes()"> Modelo
        </div>
        <div class="settingsOption checkbox">
            <input type="checkbox" id="label_registration" onchange="verifyCheckBoxes()"> Registro
        </div>
        <div class="settingsOption checkbox">
            <input type="checkbox" id="label_rate" onchange="verifyCheckBoxes()"> Razão de Subida / Descida
        </div>
        <button onclick="saveSettings()">Salvar Alterações</button>
    </div>

    <!-- Side Bar -->


    <!-- Notifications -->
    <div id="toasts_container">
    </div>
    <script src='../../../shared/apis.js'></script>
    <script src='../../../shared/snackbar.js'></script>
    <script src='script.js'></script>
</body>
</html>
